name: logic_sprint
description: "LogicSprint: fast 30-second brain games."
publish_to: 'none'

# versionName+versionCode on Android, CFBundleShortVersionString+CFBundleVersion on iOS.
version: 1.0.0+1

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  clock: ^1.1.2
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  supabase_flutter: ^2.8.0
  package_info_plus: ^9.0.0
  google_mobile_ads: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  fake_async: ^1.3.1
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# `dart run flutter_launcher_icons` after changing the icon PNGs.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/icons/logicsprint_icon_1024.png
  adaptive_icon_foreground: assets/brand/icons/android/logicsprint_foreground.png
  adaptive_icon_background: "#000000"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/brand/docs/privacy_policy.md
  fonts:
    - family: Rajdhani
      fonts:
        - asset: assets/fonts/Rajdhani-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Rajdhani-Bold.ttf
          weight: 700
    - family: IBMPlexSans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
