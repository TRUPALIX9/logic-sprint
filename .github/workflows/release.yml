name: Production Release

on:
  push:
    branches:
      - production
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build, Deploy and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run Static Analysis
        run: flutter analyze

      - name: Run Tests
        run: flutter test

      - name: Deploy Firestore Rules
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "$FIREBASE_SERVICE_ACCOUNT_JSON" > firebase-key.json
            export GOOGLE_APPLICATION_CREDENTIALS="$(pwd)/firebase-key.json"
            npx firebase-tools deploy --only firestore:rules --project logic-sprint
            rm firebase-key.json
          else
            echo "FIREBASE_SERVICE_ACCOUNT_JSON secret not found. Skipping Firestore rules deployment."
          fi

      - name: Decode Android Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEY_PROPERTIES" ]; then
            echo "Signing keys found. Preparing release signing configurations..."
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
            echo "$ANDROID_KEY_PROPERTIES" > android/key.properties
          else
            echo "No release signing keys configured in secrets. Falling back to debug signing configuration."
          fi

      - name: Build Android APK
        run: flutter build apk --release

      - name: Build Android App Bundle (AAB)
        run: flutter build appbundle --release

      - name: Extract Version
        id: get_version
        run: |
          VERSION=$(grep '^version: ' pubspec.yaml | cut -d' ' -f2)
          TAG_VERSION=$(echo "$VERSION" | tr '+' '-')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag_version=$TAG_VERSION" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || format('v{0}', steps.get_version.outputs.tag_version) }}
          name: ${{ github.event.release.name || format('Release v{0}', steps.get_version.outputs.version) }}
          draft: false
          prerelease: false
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          body: |
            LogicSprint Production Release for version ${{ steps.get_version.outputs.version }}.
            
            ### Artifacts Included
            * **Android APK (`app-release.apk`):** For direct installation and manual QA testing.
            * **Android App Bundle (`app-release.aab`):** Signed bundle for Google Play Console deployment.
            
            ### Actions Taken
            * Ran code quality checks (`flutter analyze`) and all unit tests.
            * Automatically deployed the updated Firestore Rules to the Firebase project.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
