name: Production Release

on:
  # Store builds only: push a vX.Y.Z tag (e.g. v1.0.0). Preview tags such as
  # v1.0.0-preview.1 don't match and are built locally.
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build, Deploy and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run Static Analysis
        run: flutter analyze

      - name: Run Tests
        run: flutter test

      - name: Prepare signing keys and AdMob config
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
          ADMOB_CONFIG_JSON: ${{ secrets.ADMOB_CONFIG_JSON }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEY_PROPERTIES" ]; then
            echo "::error::Set ANDROID_KEYSTORE_BASE64 and ANDROID_KEY_PROPERTIES secrets (see docs/android_release_signing.md)."
            exit 1
          fi
          if [ -z "$ADMOB_CONFIG_JSON" ]; then
            echo "::error::Set the ADMOB_CONFIG_JSON secret (contents of config/admob.json)."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
          echo "$ANDROID_KEY_PROPERTIES" > android/key.properties
          echo "$ADMOB_CONFIG_JSON" > config/admob.json

      - name: Build Android APK
        run: flutter build apk --release --dart-define-from-file=config/admob.json

      - name: Build Android App Bundle (AAB)
        run: flutter build appbundle --release --dart-define-from-file=config/admob.json

      - name: Extract Version
        id: get_version
        run: |
          VERSION=$(grep '^version: ' pubspec.yaml | cut -d' ' -f2)
          TAG_VERSION=$(echo "$VERSION" | tr '+' '-')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag_version=$TAG_VERSION" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.get_version.outputs.tag_version) }}
          name: ${{ format('LogicSprint {0}', steps.get_version.outputs.version) }}
          draft: false
          prerelease: false
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          body: |
            LogicSprint Production Release for version ${{ steps.get_version.outputs.version }}.

            ### Artifacts Included
            * **Android APK (`app-release.apk`):** For direct installation and manual QA testing.
            * **Android App Bundle (`app-release.aab`):** Signed bundle for Google Play Console deployment.

            ### Actions Taken
            * Ran code quality checks (`flutter analyze`) and all unit tests.
            * Built release APK and AAB signed with the upload keystore.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
