# Enforce production/develop branching: feature → develop, release/hotfix → production.
# Optional: require check-base-branch on production/develop after GitHub branch protection is enabled.
name: PR branch policy

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  check-base-branch: # status context name for branch protection
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR base branch
        env:
          HEAD: ${{ github.head_ref }}
          BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          case "$HEAD" in
            feature/*)
              if [[ "$BASE" != "develop" ]]; then
                echo "::error::feature/* branches must target develop (base is $BASE)."
                exit 1
              fi
              echo "OK: $HEAD → develop"
              exit 0
              ;;
            hotfix/*)
              if [[ "$BASE" != "production" ]]; then
                echo "::error::hotfix/* branches must target production (base is $BASE)."
                exit 1
              fi
              echo "OK: $HEAD → production"
              exit 0
              ;;
            develop)
              if [[ "$BASE" == "production" ]]; then
                echo "OK: release PR develop → production"
                exit 0
              fi
              ;;
          esac

          if [[ "$BASE" == "production" ]]; then
            echo "::error::Only develop (release) or hotfix/* may target production. Head: $HEAD"
            exit 1
          fi

          echo "OK: PR policy passed (head=$HEAD base=$BASE)"
