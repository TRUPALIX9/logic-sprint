<!doctype html>
<!-- One background frame of the landscape promo (1920×1080), picked by ?scene=.
     The phone's screen is left plain black; tool/creative/make_promo.py lays the
     gameplay recording into it (SCREEN below) and adds the Dynamic Island on top. -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<style>
  body { width: 1920px; height: 1080px; }
  .glow { filter: blur(140px); opacity: .45; }
  .traces path { stroke-width: 3; }

  .copy { position: absolute; left: 150px; top: 0; bottom: 0; width: 860px;
    display: flex; flex-direction: column; justify-content: center; }
  .tag { display: flex; align-items: center; gap: 16px; font: 700 30px/1 Mono; color: var(--muted); letter-spacing: 3px; }
  .tag i { width: 30px; height: 30px; border-radius: 6px; transform: skewX(-12deg); }
  h1 { font: 700 128px/0.95 Rajdhani; text-transform: uppercase; margin-top: 34px; letter-spacing: 1px; }
  p { font-size: 46px; line-height: 1.3; color: var(--muted); margin-top: 34px; max-width: 800px; }

  /* Fixed pixel phone, so the screen hole has known coordinates:
     screen = x 1240, y 80, 416×920, corner radius 50. */
  .device { position: absolute; left: 1220px; top: 60px; width: 456px; height: 960px; }
  .device .frame { padding: 6px; border-radius: 68px;
    box-shadow: 0 30px 90px rgba(0,0,0,.85), inset 0 0 0 2px rgba(255,255,255,.18); }
  .device .bezel { padding: 14px; border-radius: 62px; }
  .device .screen { border-radius: 50px; }
  .device .screen::after { display: none; }
  .device .btn { width: 5px; }

  .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .logo { display: flex; align-items: center; gap: 34px; }
  .logo svg { width: 200px; height: 160px; }
  .word { font: 700 150px/1 Rajdhani; font-style: italic; letter-spacing: 3px; }
  .word b { color: var(--teal); }
  .center p { margin-top: 44px; font-size: 56px; color: var(--text); max-width: none; }
  .center .small { margin-top: 26px; font-size: 38px; color: var(--muted); }
  .chips { display: flex; gap: 44px; margin-top: 60px; font: 700 34px/1 Mono; color: var(--muted); }
  .chips span { display: flex; align-items: center; gap: 14px; }
  .chips i { width: 28px; height: 28px; border-radius: 6px; transform: skewX(-12deg); }
</style></head>
<body>
  <div class="glow" style="width:900px;height:700px;left:1000px;top:250px;background:var(--blue)"></div>
  <div class="glow" style="width:800px;height:700px;left:1300px;top:80px;background:var(--teal)"></div>
  <svg class="traces" viewBox="0 0 1920 1080">
    <path d="M0 80 H260 L320 140 H560"/><circle cx="560" cy="140" r="9"/>
    <path d="M0 1000 H230 L290 940 H500"/><circle cx="500" cy="940" r="9"/>
  </svg>
  <div id="root"></div>

<script>
const LOGO = `<svg viewBox="0 0 125 100"><g stroke-linecap="round" fill="none">
  <path d="M8 32 H33 M3 50 H28 M8 68 H33" stroke="#677A8C" stroke-width="9"/>
  <path d="M48 12 L86 50 L48 88" stroke="#3B7BF0" stroke-width="18" stroke-linejoin="round"/>
  <path d="M80 12 L118 50 L80 88" stroke="#34C29A" stroke-width="18" stroke-linejoin="round"/></g></svg>`;
const CHIPS = `<div class="chips">
  <span><i style="background:var(--blue)"></i>REFLEX</span><span><i style="background:var(--teal)"></i>MATH</span>
  <span><i style="background:var(--violet)"></i>FOCUS</span><span><i style="background:var(--aqua)"></i>RECALL</span></div>`;

const SCENES = {
  intro: { center: `<div class="logo">${LOGO}<div class="word">LOGIC<b>SPRINT</b></div></div>
    <p>4 endless brain games</p>${CHIPS}` },
  outro: { center: `<div class="logo">${LOGO}<div class="word">LOGIC<b>SPRINT</b></div></div>
    <p>How far can you go?</p><div class="small">Free on the App Store and Google Play · No sign-up</div>` },
  home:    { tag: 'LOGICSPRINT', color: 'var(--teal)',   title: 'Pick a game',     body: 'Four endless games. Every run gets harder until your first mistake.' },
  rocket:  { tag: 'REFLEX',      color: 'var(--blue)',   title: 'Rocket Launch',   body: 'Steer through the asteroid storm. One hit ends the run.' },
  memory:  { tag: 'RECALL',      color: 'var(--aqua)',   title: 'Memory Lane',     body: 'Watch the tiles light up, then tap them back in order.' },
  math:    { tag: 'MATH',        color: 'var(--teal)',   title: 'Quick Math',      body: 'Pick the right answer. The numbers grow every 10 problems.' },
  color:   { tag: 'FOCUS',       color: 'var(--violet)', title: 'Guess Color',     body: 'Color or text? Follow the rule as it flips.' },
  ranks:   { tag: 'COMPETE',     color: 'var(--gold)',   title: 'Global Top 10',   body: 'Climb the daily leaderboard for every game.' },
  profile: { tag: 'PROGRESS',    color: 'var(--coral)',  title: 'Beat your best',  body: 'Personal bests, play counts and run history. No login needed.' },
};

const s = SCENES[new URLSearchParams(location.search).get('scene')];
const root = document.getElementById('root');
if (s.center) {
  root.innerHTML = `<div class="center">${s.center}</div>`;
} else {
  root.innerHTML = `
    <div class="copy">
      <div class="tag"><i style="background:${s.color}"></i>${s.tag}</div>
      <h1>${s.title}</h1><p>${s.body}</p>
    </div>
    <div class="device">
      <div class="btn" style="left:-3px;top:110px;height:36px"></div>
      <div class="btn" style="left:-3px;top:175px;height:64px"></div>
      <div class="btn" style="left:-3px;top:255px;height:64px"></div>
      <div class="btn" style="right:-3px;top:200px;height:100px"></div>
      <div class="frame"><div class="bezel"><div class="screen"></div></div></div>
    </div>`;
}
</script>
</body></html>
